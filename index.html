<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wi-Fi & Speed Tester</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2d3">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 400px; text-align: center; }
    h1 { color: #00d2d3; font-size: 24px; margin-bottom: 20px; margin-top: 10px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; }
    .metric { display: flex; justify-content: space-between; margin: 12px 0; font-size: 16px; border-bottom: 1px solid #2a2a2a; padding-bottom: 8px; }
    .metric span:last-child { font-weight: bold; color: #2ed573; font-size: 18px; }
    .btn { background: #00d2d3; color: #121212; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn:disabled { background: #555; color: #888; }
    .status { margin-top: 15px; font-size: 14px; color: #ffa502; min-height: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ Wi-Fi & Speed Tester</h1>

  <div class="card">
    <div class="metric">
      <span>কানেকশন টাইপ:</span>
      <span id="conn-type">চেক করা হচ্ছে...</span>
    </div>
    <div class="metric">
      <span>Ping (Latency):</span>
      <span id="ping-val">-- ms</span>
    </div>
    <div class="metric">
      <span>Jitter (স্থিরতা):</span>
      <span id="jitter-val">-- ms</span>
    </div>
    <div class="metric">
      <span>Download Speed:</span>
      <span id="speed-val">-- Mbps</span>
    </div>
  </div>

  <button class="btn" id="startBtn" onclick="runSpeedTest()">টেস্ট শুরু করুন</button>
  <div class="status" id="status-text"></div>
</div>

<script>
  // Service Worker রেজিস্টার
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  // কানেকশন টাইপ ডিটেকশন
  function updateConnectionInfo() {
    if ('connection' in navigator) {
      const conn = navigator.connection;
      document.getElementById('conn-type').innerText = conn.effectiveType ? conn.effectiveType.toUpperCase() : 'Wi-Fi/LAN';
    } else {
      document.getElementById('conn-type').innerText = 'Online';
    }
  }
  updateConnectionInfo();

  // পিং এবং জিটার টেস্ট
  async function testPingAndJitter() {
    const pings = [];
    for (let i = 0; i < 4; i++) {
      const start = performance.now();
      try {
        await fetch('https://www.cloudflare.com/cdn-cgi/trace?' + Date.now(), { cache: 'no-store', mode: 'no-cors' });
        pings.push(performance.now() - start);
      } catch (e) {}
    }
    if (pings.length === 0) return { ping: null, jitter: null };

    const avgPing = Math.round(pings.reduce((a, b) => a + b, 0) / pings.length);
    let jitter = 0;
    for (let i = 1; i < pings.length; i++) {
      jitter += Math.abs(pings[i] - pings[i - 1]);
    }
    jitter = Math.round(jitter / (pings.length - 1));

    return { ping: avgPing, jitter: jitter };
  }

  // ডাউনলোড স্পিড টেস্ট
  async function testDownloadSpeed() {
    const testFile = 'https://speed.cloudflare.com/__down?bytes=5000000'; // ৫ মেগাবাইট ফাইল
    const start = performance.now();
    try {
      const response = await fetch(testFile, { cache: 'no-store' });
      const reader = response.body.getReader();
      let receivedBytes = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        receivedBytes += value.length;
      }

      const durationSec = (performance.now() - start) / 1000;
      const speedMbps = ((receivedBytes * 8) / durationSec / (1024 * 1024)).toFixed(2);
      return speedMbps;
    } catch (e) {
      return null;
    }
  }

  async function runSpeedTest() {
    const btn = document.getElementById('startBtn');
    const status = document.getElementById('status-text');
    btn.disabled = true;

    status.innerText = "পিং এবং জিটার পরিমাপ করা হচ্ছে...";
    const { ping, jitter } = await testPingAndJitter();
    document.getElementById('ping-val').innerText = ping ? `${ping} ms` : 'Error';
    document.getElementById('jitter-val').innerText = jitter ? `${jitter} ms` : 'Error';

    status.innerText = "ডাউনলোড স্পিড টেস্ট হচ্ছে...";
    const speed = await testDownloadSpeed();
    document.getElementById('speed-val').innerText = speed ? `${speed} Mbps` : 'Error';

    status.innerText = "টেস্ট সম্পন্ন হয়েছে!";
    btn.disabled = false;
  }
</script>

</body>
</html>
